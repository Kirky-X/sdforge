[package]
name = "axiom-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Axiom framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiom-rs/axiom"

[[bin]]
name = "cargo-axiom"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
tera = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
thiserror = "2.0"

[dev-dependencies]
trybuild = "1.0"
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.1"
