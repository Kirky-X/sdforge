edition = "2021"
version = "0.3.0"

# Base configuration
max_width = 120
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"

# Code style
fn_single_line = true
fn_params_layout = "Vertical"
fn_arg_indent = 4
reorder_impl_items = true
reorder_methods = true
struct_field_align_threshold = 0

# Imports
group_imports = "StdExternalCrate"
imports_granularity = "Crate"

# Comments
comment_width = 100
wrap_comments = true

# Match arms
match_arm_blocks = true
match_arm_leading_pipes = "Preserve"

# Expressions
expr_indent_style = "Block"
trailing_comma = "Vertical"
struct_lit_width = "BreakIfNested"

# Where clauses
where_single_line = true
where_layout = "Vertical"

# Types
type_alias_size = "Compressed"

# Misc
format_code_in_doc_comments = true
edition = "2021"
