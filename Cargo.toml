[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/Kirky-X/sdforge"

[workspace.dependencies]
# 核心依赖
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
thiserror = "~2.0"

# 过程宏依赖
proc-macro2 = "~1.0"
syn = { version = "~2.0", features = ["full", "extra-traits"] }
quote = "~1.0"

# HTTP 依赖
axum = { version = "~0.8.8", features = ["ws"] }
tower = "~0.5"
tower-http = { version = "~0.6", features = ["cors", "limit", "timeout", "set-header", "compression-gzip", "compression-deflate"] }
inventory = "~0.3"

# 异步依赖
tokio = { version = "~1.50", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures = "~0.3"
tokio-stream = "~0.1"
async-trait = "~0.1"

# 工具依赖
uuid = { version = "~1.22", features = ["v4"] }
chrono = { version = "~0.4", features = ["serde"] }
regex = "~1.12"
validator = { version = "~0.20", features = ["derive"] }
once_cell = "~1.21"

# 安全依赖
dashmap = "~6.1"
hmac = "~0.12"
sha2 = "~0.10"
secrets = "~1.2"
zeroize = "~1.8"
subtle = "~2.6"
argon2 = { version = "~0.5", features = ["std"] }
password-hash = { version = "~0.6", default-features = false }
rand = "~0.8"
hex = "~0.4"

# 配置依赖（使用相对路径）
confers = { path = "../confers", features = ["watch"] }
toml = "~0.9"
schemars = "~0.8"

# 缓存依赖（使用相对路径）
oxcache = { version = "0.2", path = "../oxcache", features = ["rate-limiting", "dashmap"] }
http = "~1.4"
bincode = "~1.3"

# WebSocket 依赖
tokio-tungstenite = "~0.29"
axum-extra = { version = "~0.12", features = ["typed-header"] }

# gRPC 依赖
tonic = "~0.14"
prost = "~0.14"

# CLI 依赖
clap = { version = "~4.6", features = ["derive"] }
tera = "~1.20"
walkdir = "~2.5"

# 开发依赖
tempfile = "~3.27"
serial_test = "~3.4"
axum-test = "19"
reqwest = { version = "~0.13", features = ["json"] }
criterion = "~0.8"
trybuild = "~1.0"
proptest = "~1.11"
pretty_assertions = "~1.4"


[package]
name = "sdforge"
version = "0.1.0"
edition = "2021"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/Kirky-X/sdforge"
keywords = ["api", "http", "mcp", "macro", "framework"]
categories = ["web-programming", "development-tools"]
description = "Multi-protocol SDK framework with unified macro configuration"
documentation = "https://docs.rs/sdforge"

[lib]
path = "src/lib.rs"

[dependencies]
# Core dependencies (always required)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sdforge-macros = { version = "0.1.0", path = "./macros" }

# HTTP dependencies
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { version = "0.6.8", optional = true, features = ["cors", "limit", "timeout", "set-header", "compression-gzip", "compression-deflate"] }
inventory = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true, features = ["typed-header"] }
futures = { workspace = true, optional = true }

# MCP dependencies
mcp-sdk = { version = "0.0.3", optional = true }
anyhow = { version = "1.0", optional = true }

# Streaming dependencies
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }

# WebSocket dependencies
tokio-tungstenite = { version = "0.23", optional = true }
async-trait = { version = "0.1", optional = true }

# gRPC dependencies
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-prost = { version = "0.14", optional = true }

# Feature dependencies
chrono = { workspace = true, optional = true }

# Validation dependencies
validator = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }

# Security dependencies
dashmap = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
secrets = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
password-hash = { version = "0.6.0-rc.11", optional = true }
rand = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

# Configuration dependencies (按特性导入)
confers = { path = "../confers", optional = true, features = ["watch"] }
toml = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Cache dependencies (按特性导入) - oxcache 自己管理 sha2/md5/bytes/http 等
oxcache = { version = "0.2", path = "../oxcache", features = ["rate-limiting", "dashmap"], optional = true }
http = { workspace = true, optional = true }

# Serialization for SyncCache storage values
bincode = { workspace = true, optional = true }

# SIMD-accelerated JSON (optional, requires SIMD support)
simd-json = { version = "~0.14", optional = true }

# CLI dependencies (按特性导入)
clap = { workspace = true, optional = true }
tera = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
url = "2.5.8"
base64 = "0.22.1"

[dev-dependencies]
tokio = { workspace = true }
tokio-stream = { workspace = true }
once_cell = { workspace = true }
sdforge-macros = { version = "0.1.0", path = "./macros" }
tempfile = { workspace = true }
serial_test = { workspace = true }
axum-test = "19"
reqwest = { workspace = true }
criterion = { workspace = true }
trybuild = { workspace = true }
proptest = { workspace = true }

[features]
default = ["http"]

# HTTP 特性 - 启用时编译 confers、axum 等
http = [
    "confers",
    "axum",
    "tower",
    "tower-http",
    "inventory",
    "tokio",
    "axum-extra",
    "toml",
    "regex",
    "once_cell",
    "validator",
    "dashmap",
    "uuid",
    "futures",
]

# MCP 特性
mcp = ["mcp-sdk", "inventory", "anyhow"]

# Streaming 特性
streaming = ["http", "tokio-stream", "futures-util", "chrono"]

# Timestamp 特性
timestamp = ["chrono"]

# CLI 特性
cli = [
    "clap",
    "anyhow",
    "tera",
    "walkdir",
    "confers/cli",
]
# Security 特性
security = [
    "http",
    "dashmap",
    "uuid",
    "hmac",
    "sha2",
    "chrono",
    "tokio",
    "secrets",
    "zeroize",
    "subtle",
    "once_cell",
    "argon2",
    "password-hash",
    "rand",
    "regex",
    "oxcache/rate-limiting",
    "bincode",
    "confers",
    "cache",
    "hex",
]

# Hot reload 特性
hot-reload = ["http", "confers"]

# Confers 扩展特性
validation = ["confers/validation"]
schema = ["confers/schema", "schemars"]
watch = ["confers/watch"]
audit = ["confers/audit"]

# WebSocket 特性
websocket = ["http", "streaming", "tokio-tungstenite", "axum-extra", "async-trait", "chrono"]

# gRPC 特性
grpc = ["http", "tonic", "prost", "tonic-prost"]

# Cache 特性 - oxcache 提供缓存抽象，rate-limiting 提供 TokenBucket
cache = ["dep:http", "oxcache/rate-limiting", "async-trait"]

# Logging 特性
logging = ["chrono", "tokio"]

# SIMD JSON 特性 - 使用 SIMD 加速的 JSON 序列化/反序列化
simd-json = ["dep:simd-json"]

# Full 特性
full = [
    "http",
    "mcp",
    "streaming",
    "timestamp",
    "security",
    "hot-reload",
    "cache",
    "websocket",
    "grpc",
    "logging",
]
hex = ["dep:hex"]

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "sdforge"
path = "src/main.rs"

[[bench]]
name = "axiom_bench"
path = "src/benches/sdforge_bench.rs"
harness = false

# Cache tests
[[test]]
name = "cache_tests"
path = "tests/integration/cache_tests.rs"

# Integration tests
[[test]]
name = "feature_combinations"
path = "tests/integration/feature_combinations.rs"

[[test]]
name = "grpc_tests"
path = "tests/integration/grpc_tests.rs"

[[test]]
name = "http_integration"
path = "tests/integration/http_integration.rs"

[[test]]
name = "mcp_integration"
path = "tests/integration/mcp_integration.rs"

[[test]]
name = "mcp_protocol_tests"
path = "tests/integration/mcp_protocol_tests.rs"

[[test]]
name = "security_headers_tests"
path = "tests/integration/security_headers_tests.rs"

[[test]]
name = "security_middleware_tests"
path = "tests/integration/security_middleware_tests.rs"

[[test]]
name = "security_tests"
path = "tests/integration/security_tests.rs"

[[test]]
name = "streaming_tests"
path = "tests/integration/streaming_tests.rs"

[[test]]
name = "uat_tests"
path = "tests/integration/uat_tests.rs"

[[test]]
name = "websocket_integration_tests"
path = "tests/integration/websocket_integration_tests.rs"

[[test]]
name = "websocket_tests"
path = "tests/integration/websocket_tests.rs"

[[test]]
name = "integration_http_mcp"
path = "tests/integration_http_mcp.rs"

[[test]]
name = "http_tests"
path = "tests/integration/http_tests.rs"

# Unit tests
[[test]]
name = "config_tests"
path = "tests/unit/config_tests.rs"

[[test]]
name = "core_tests"
path = "tests/unit/core_tests.rs"

[[test]]
name = "edge_case_tests"
path = "tests/unit/edge_case_tests.rs"

[[test]]
name = "http_version_routing_tests"
path = "tests/unit/http_version_routing_tests.rs"

[[test]]
name = "mcp_tool_instance_tests"
path = "tests/unit/mcp_tool_instance_tests.rs"

[[test]]
name = "error_handling_tests"
path = "tests/integration/error_handling_tests.rs"

[[test]]
name = "macro_tests"
path = "tests/macros/macro_tests.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"

[profile.dev]
debug = true

[profile.dev.package."*"]
opt-level = 2







