[workspace]
members = [".", "examples", "macros"]
resolver = "2"

[workspace.package]
version = "0.5.0-rc.9"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
repository = "https://github.com/Kirky-X/sdforge"

[workspace.dependencies]
# 核心依赖
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false }
log = { version = "0.4", default-features = false, features = ["std"] }

# 过程宏依赖
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
syn = { version = "3.0", default-features = false, features = ["full", "extra-traits", "parsing", "printing", "clone-impls", "proc-macro"] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }

# HTTP 依赖
axum = { version = "0.8", default-features = false, features = ["http1", "json", "form", "matched-path", "query", "tokio", "tower-log", "tracing", "ws"] }
tower = { version = "0.5", default-features = false, features = ["log", "util", "timeout", "limit", "load-shed"] }
tower-http = { version = "0.7", default-features = false, features = ["cors", "limit", "timeout", "set-header", "compression-gzip", "compression-deflate"] }
inventory = { version = "0.3", default-features = false }

# 异步依赖
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# futures-util：仅用 Stream/Sink 面；关闭 async-await 宏以剪掉 futures-macro
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", default-features = false }

# 工具依赖
uuid = { version = "1.28", default-features = false, features = ["std", "v4"] }
# chrono 仅取时间戳/RFC3339 字符串，无类型进入公共签名或序列化面
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# regex unicode 必须显式声明：pattern 属用户可见语义，收窄会静默降级为 ASCII
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
validator = { version = "0.21", default-features = false, features = ["derive"] }
once_cell = { version = "1.21", default-features = false, features = ["std"] }

# 安全依赖
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
base64 = { version = "0.23", default-features = false, features = ["std", "alloc"] }

# 配置依赖 - sdforge 生产面只用 toml::de::Error 类型（AuthConfigError::ParseError 载荷），本包不声明 parse/display
toml = { version = "1.1", default-features = false }

# oxcache minimal + byte-weight（复用 moka，不新增依赖）
oxcache = { version = "0.5.0-rc.9", default-features = false, features = ["minimal", "byte-weight"] }

# confers/watch：去抖文件监听，仅 tls-watch 门控；无环
confers = { version = "0.6.0-rc.11", default-features = false, features = ["watch"] }

# 数据库网关 - dbnexus 0.6 embedded（sqlite）+ sql-parser：数据 API 网关的
# 池化/解析面（db-integration feature）
dbnexus = { version = "0.6.0-rc.10", default-features = false, features = ["embedded", "sql-parser"] }

# async trait 实现 - limiteron DistributedLimiter trait 的 mock/适配实现用
# （trait 本身以 async_trait 声明；依赖已在依赖树中，显式声明供实现侧使用）
async-trait = { version = "0.1", default-features = false }
http = { version = "1.5", default-features = false, features = ["std"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

# WebSocket 依赖
axum-extra = { version = "0.12", default-features = false, features = ["typed-header"] }

# gRPC 依赖
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
prost = { version = "0.14", default-features = false, features = ["derive"] }
tonic-prost = { version = "0.14", default-features = false }

# 流控依赖 - limiteron 0.2.1 提供统一限流/封禁/配额/熔断
# 纯 crates.io 版本依赖（rc.2 已发布；本地跨仓联调可用 .cargo/config.toml [patch]）。
limiteron = { version = "0.3.0-rc.6", default-features = false }

# OpenAPI 依赖
utoipa = { version = "6.0", default-features = false, features = ["macros"] }

# schemars：derive JsonSchema 产出精确 response schema；std 支持常用 std 类型
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }

# CLI 依赖 - clap 4.6 提供命令行解析（derive feature 用于过程宏派生）
# string feature 启用 Str: From<String>，支持运行时配置程序名
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "string"] }

# Swagger UI 静态资产内嵌 assets/swagger-ui/（include_bytes!）

# CLI Markdown 文档依赖 - clap-markdown 0.1 从 clap::Command 生成 Markdown 命令手册
clap-markdown = { version = "0.1", default-features = false }

# TLS 依赖 - rustls 0.23 aws-lc-rs provider（与 grpc-tls 的 tonic/tls-aws-lc 同一密码学栈）
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-pki-types = { version = "1.15", default-features = false, features = ["std"] }
hyper = { version = "1.12", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "tokio"] }

# 其他依赖：simd-json 的 runtime-detection：x86 上运行时探测 avx2/sse4.2 的 SIMD 分派
simd-json = { version = "0.18", default-features = false, features = ["serde_impl", "runtime-detection"] }

# 系统语言探测 - i18n 检测链尾段（SDFORGE_LANG → LC_ALL → LC_MESSAGES → LANG → sys-locale → en）
sys-locale = { version = "0.3", default-features = false }

# Fluent en/zh 双束常驻编译，无条件依赖（与 dbnexus/limiteron 同口径）
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }

# tempfile getrandom：失败重试时从系统熵重播种，关闭只剩固定随机度
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
serial_test = { version = "4.0", default-features = false }
axum-test = { version = "21", default-features = false, features = ["ws"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
criterion = { version = "0.8", default-features = false }
trybuild = { version = "1.0", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std", "alloc", "bit-set"] }

[workspace.lints.rust]

[workspace.lints.clippy]

[package]
name = "sdforge"
version.workspace = true
edition.workspace = true
# examples/ 为独立成员 crate，根包不得自动发现其示例（依赖仅成员声明）
autoexamples = false
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["api", "http", "mcp", "macro", "framework"]
categories = ["web-programming", "development-tools"]
description = "Multi-protocol SDK framework with unified macro configuration"
documentation = "https://docs.rs/sdforge"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# 性能验证示例需 cache 特性（SyncCache），用 required-features 显式声明
[[example]]
name = "perf_regex_cache"
required-features = ["cache"]
[[example]]
name = "perf_lru_eviction"
required-features = ["cache"]
[[example]]
name = "perf_prefix_index"
required-features = ["cache"]
[[example]]
name = "perf_batch_ops"
required-features = ["cache"]

# CLI 基础示例 — 演示 #[forge(cli=true)] + CliBuilder 集成
[[example]]
name = "basic_cli"
required-features = ["cli"]

# Swagger UI 示例 — 演示 swagger_ui_router() + axum serve
[[example]]
name = "swagger_demo"
required-features = ["docgen", "http"]

[dependencies]
# Core dependencies (always required)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
sdforge-macros = { version = "0.5.0-rc.9", path = "./macros", default-features = false }

# HTTP dependencies
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }

# MCP dependencies (migrated from mcp-sdk 0.0.3 to official rmcp)
# transport-io enables rmcp::transport::stdio() used by serve_stdio()
rmcp = { version = "3.5", optional = true, default-features = false, features = ["server", "transport-io"] }
anyhow = { version = "1.0", optional = true, default-features = false, features = ["std"] }

# Streaming dependencies
tokio-stream = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# gRPC dependencies
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

# TLS dependencies (serve-tls feature)
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }

# OpenAPI dependencies
utoipa = { workspace = true, optional = true }

# JSON Schema reflection dependencies（返回类型 Schema 反射，schemars feature）
schemars = { workspace = true, optional = true }

# CLI dependencies - clap 用于命令行参数解析
clap = { workspace = true, optional = true }

# Docs dependencies - CLI/Markdown 文档生成
#（Swagger UI 静态资产自 vendor 于 assets/swagger-ui/，零额外依赖）
clap-markdown = { workspace = true, optional = true }

# Feature dependencies
chrono = { workspace = true, optional = true }

# Validation dependencies
validator = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }

# Security dependencies
uuid = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# Configuration dependencies
toml = { workspace = true, optional = true }

# Cache dependencies - oxcache 0.3 用 memory feature 提供缓存后端
oxcache = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# TLS 证书文件监听（tls-watch feature 独占，经 confers watch feature 门控）
confers = { workspace = true, optional = true }

# dbnexus 数据 API 网关（db-integration feature）
dbnexus = { workspace = true, optional = true }

# limiteron DistributedLimiter trait 的 mock/适配实现用
async-trait = { workspace = true }

# Serialization for SyncCache storage values
postcard = { workspace = true, optional = true }

# SIMD-accelerated JSON (optional, requires SIMD support)
simd-json = { workspace = true, optional = true }

# Rate limiting dependencies - limiteron 0.2.1 提供统一流控
limiteron = { workspace = true, optional = true }

# trait-kit 集成（kit feature），已发布 crates.io
trait-kit = { version = "0.5.0-rc.10", default-features = false, features = ["async"], optional = true }

# inklog 结构化日志集成 (optional, feature-gated by `inklog`).纯 crates.io 版本依赖（rc.2 已发布）
inklog = { version = "0.3.0-rc.10", default-features = false, optional = true }

# ICU4X（i18n feature）：数字/日期/复数/排序格式化 + Accept-Language 解析
icu = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# writeable 默认 feature 为 alloc（write_to_string 需要），显式声明同一集合
writeable = { version = "0.6", default-features = false, features = ["alloc"], optional = true }
# System locale detection for the i18n detection chain (i18n feature only;
# without the feature the chain stops at the POSIX env variables).
sys-locale = { workspace = true, optional = true }

# Fluent en/zh 解析（翻译注册表常驻编译）
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# inklog_bridge 测试：验证 tracing 结构化事件经订阅器落盘
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# dist 熔断测试用 MockClock（test-clock）+ 与 ratelimit 共享 limiteron 实例
limiteron = { workspace = true, features = ["test-clock"] }
# TOML 契约测试用 toml::from_str（parse+serde+std）
toml = { workspace = true, features = ["parse", "serde", "std"] }
# 反射两态集成测试的 derive 依赖（dev-only，不影响发布面）
schemars = { workspace = true }
# 资产审计：NOTICE.md SHA-256 与 swagger-ui 字节复验（仅测试面）
sha2 = { workspace = true }
tokio-stream = { workspace = true }
once_cell = { workspace = true }
sdforge-macros = { version = "0.5.0-rc.9", path = "./macros", default-features = false }
tempfile = { workspace = true }
serial_test = { workspace = true }
axum-test = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "http2"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = []

# HTTP 特性 - 启用时编译 axum 等
http = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:inventory",
    "tokio",
    "dep:axum-extra",
    "dep:regex",
    "dep:once_cell",
    "dep:validator",
    "dep:uuid",
    # regex_cache 用 oxcache ByteWeightCache；http 不蕴含 cache，故显式 dep:oxcache
    "dep:oxcache",
]

# MCP 特性 (migrated to official rmcp SDK 3.x)
# http crate needed for MCP 2026-07-28 stateless HTTP header parsing (Mcp-Method/Mcp-Name)
mcp = ["dep:rmcp", "dep:inventory", "dep:anyhow", "dep:http"]

# streaming：独立于 http，仅 tokio/tokio-stream/futures-util
streaming = ["dep:tokio", "dep:tokio-stream", "dep:futures-util", "dep:chrono"]

# Timestamp 特性
timestamp = ["dep:chrono"]

# ratelimit 核心：RateLimiter + LimiteronAdapter，不依赖 axum/tower
ratelimit = [
    "dep:limiteron",
    "limiteron/ban-manager",
    "limiteron/quota-control",
    "limiteron/circuit-breaker",
]

# ratelimit-http：Tower 中间件 + check_request（依赖 http + ratelimit）
ratelimit-http = [
    "http",
    "ratelimit",
]

# Security 特性
security = [
    "http",
    "dep:uuid",
    "dep:hmac",
    "dep:sha2",
    "dep:chrono",
    "tokio",
    "dep:subtle",
    "dep:once_cell",
    "dep:rand",
    "dep:regex",
    "dep:postcard",
    "cache",
    "dep:hex",
    "dep:base64",
    # toml 仅被 security 下的 AuthConfigError 使用，故挂 security 而非 http
    "dep:toml",
    "ratelimit-http",
    "dep:oxcache",
]

# WebSocket 特性
websocket = ["http", "streaming", "dep:axum-extra", "dep:chrono"]

# gRPC 特性
# 独立于 http：grpc 模块只用 tonic + prost + serde_json + futures-util (catch_unwind)
grpc = ["dep:tonic", "dep:prost", "dep:tonic-prost", "dep:inventory", "dep:futures-util"]

# gRPC TLS 特性 - 只做 ServerTlsConfig 接线暴露，证书加载由调用方负责
grpc-tls = ["grpc", "tonic/tls-aws-lc", "tonic/transport"]

# serve-tls：rustls 进程内 TLS（PEM + ALPN + 可选热重载）
serve-tls = [
    "http",
    "graceful",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:hyper",
    "dep:hyper-util",
]

# tls-watch：confers FsWatcher 监听证书变化并自动重载，并入 full
tls-watch = ["serve-tls", "dep:confers"]

# OpenAPI 特性 - 自动生成 OpenAPI 3.1 规范
# 独立于 http：openapi 模块只用 utoipa + inventory + serde_json
openapi = ["dep:utoipa", "dep:inventory"]

# distributed：limiteron 分布式计数（lua-script → Redis 原子窗口）
ratelimit-dist = ["ratelimit", "limiteron/distributed", "limiteron/lua-script"]

# oxcache Redis L2 - RedisBackend 同步面接入 SyncCache（跨副本共享缓存层，
# 蕴含 cache；故障固有 fail-open：读 miss/写跳过 + 窗口限速告警）
cache-l2 = ["cache", "oxcache/redis"]

# dbnexus 数据 API 网关 - 白名单只读数据面（DbGateway，衔接 dbnexus DbPool
# 的池化/权限/RLS 语义；独立于 http，端点暴露按需组合）
db-integration = ["dep:dbnexus"]

# schema-reflect：schemars 为返回值发射精确 response schema
schemars = ["openapi", "dep:schemars"]

# CLI 特性 - clap 集成，与 HTTP/MCP 并列的第三种服务入口
# 独立于 http：cli 模块只用 clap + inventory + crate::core::ApiError
cli = ["dep:clap", "dep:inventory"]

# docgen：Swagger UI + CLI/MCP Markdown（依赖 openapi + cli）
docgen = ["openapi", "dep:clap-markdown", "cli"]
# 兼容别名：旧 feature 名 docs 转发到 docgen（正名迁移，避免与 docs.rs 文档构建歧义）
docs = ["docgen"]

# 客户端 SDK 生成 - 从 openapi/grpc 注册表生成 Rust/TypeScript 客户端，
# 经保留 CLI 子命令 `sdk` 输出（蕴含 openapi 注册面 + cli 子命令分发）
sdk = ["openapi", "cli"]

# Cache 特性 - oxcache 0.3 用 minimal feature 提供缓存后端
# cache 模块不依赖 http（已验证 src/cache/ 无 http/axum 使用）
cache = ["oxcache/minimal"]

# Health probes 特性 - build_with_config 自动挂载 /healthz /readyz
# （bypass 认证：探针路由在安全中间件层之后注册）。kit 数据源经 `kit` 特性提供。
health = ["http", "tokio"]

# Prometheus metrics 特性 - 请求计数/延迟直方图/状态码分布自动采集，
# /metrics 端点 bypass 认证；自研轻量 Prometheus 文本渲染（无 prometheus 依赖）。
metrics = ["http", "tokio"]

# 优雅停机特性 - SIGTERM/SIGINT → 停止接新 → 排空在途（超时上限）→
# kit 三阶段关闭；serve_with_graceful_shutdown 集成入口。
graceful = ["http", "tokio", "tokio?/signal"]

# 请求上下文特性 - request_id/trace_id 生成与跨协议（HTTP/MCP/gRPC/WS）
# 注入，日志关联字段；tokio task_local 承载。
context = ["tokio"]

# 参数校验契约特性 - #[forge(validate)] + #[param(ge/le/...)] 校验规则，
# 400 带字段级错误；验证语句由宏注入 HTTP 处理闭包。
validate = ["http", "tokio"]

# 声明式分页特性 - #[forge(paginate)] 自动 page/size 查询参数与
# {items,total,next} 响应包装；处理函数返回完整 Vec<T>。
paginate = ["http", "tokio"]

# ETag 条件请求特性 - GET 响应自动强 ETag（SHA-256）+ If-None-Match → 304。
etag = ["http", "dep:sha2"]

# 生命周期钩子特性 - #[forge(on_start/on_stop)] 进程级钩子，
# 与优雅停机顺序协同（on_start 先于监听、on_stop 在排空之后）。
lifecycle = ["http", "tokio", "dep:futures-util"]

# 钩子管道特性 - 处理器前后钩子（中间件式），统一错误契约同批交付。
hooks = ["http", "tokio"]

# OTel 全栈观测特性 - OTLP/HTTP JSON 导出（MVP：本地 collector，无 TLS），
# 请求 span 中间件 + 指标快照导出；零额外依赖（自研轻量 HTTP POST）。
otel = ["http", "tokio"]

# 幂等重放防护特性 - Idempotency-Key HTTP 中间件 + gRPC metadata 路径
# 依赖 http（中间件）与 cache（IdempotencyStore 后端）
idempotency = ["http", "cache", "tokio"]

# tokio feature (enables dep:tokio; referenced by #[cfg(feature = "tokio")] in source)
tokio = ["dep:tokio"]

# SIMD JSON 特性 - 使用 SIMD 加速的 JSON 序列化/反序列化
simd-json = ["dep:simd-json"]

# trait-kit 0.3 AsyncKit integration (SdforgeModule).
limiteron-integration = ["dep:limiteron"]
# trait-kit health 供 /readyz，lifecycle 供分阶段收尾
kit = ["dep:trait-kit", "trait-kit/health", "trait-kit/lifecycle", "limiteron-integration", "limiteron/kit", "oxcache/kit"]

# inklog 结构化日志集成 — 将裸 log 输出桥接到 inklog LoggerManager
inklog = ["dep:inklog"]

# ICU4X：本地化错误消息、时间格式、复数与 Accept-Language 解析
i18n = ["dep:icu", "dep:writeable", "dep:sys-locale"]

# full：全量运行时特性集；排除 simd-json/kit/limiteron-integration 等重依赖
full = [
    "http",
    "mcp",
    "streaming",
    "timestamp",
    "security",
    "cache",
    "health",
    "metrics",
    "graceful",
    "context",
    "websocket",
    "grpc",
