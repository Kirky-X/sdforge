[package]
name = "sdforge"
version = "0.1.0"
edition = "2021"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/Kirky-X/sdforge"
keywords = ["api", "http", "mcp", "macro", "framework"]
categories = ["web-programming", "development-tools"]
description = "Multi-protocol SDK framework with unified macro configuration"
documentation = "https://docs.rs/sdforge"

[lib]
path = "src/lib.rs"

[dependencies]
# Core dependencies (always required)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sdforge-macros = { version = "0.1.0", path = "./macros" }

# HTTP dependencies
axum = { version = "0.8.8", optional = true, features = ["ws"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6.8", optional = true, features = ["cors", "limit", "timeout", "set-header", "compression-gzip", "compression-deflate"] }
inventory = { version = "0.3", optional = true }
figment = { version = "0.10", optional = true }
tokio = { version = "1.49", optional = true, features = ["full"] }
axum-extra = { version = "0.10", optional = true, features = ["typed-header"] }
futures = { version = "0.3", optional = true }

# MCP dependencies
mcp-sdk = { version = "0.0.3", optional = true }
anyhow = { version = "1.0", optional = true }

# Streaming dependencies
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }

# WebSocket dependencies
tokio-tungstenite = { version = "0.23", optional = true }
async-trait = { version = "0.1", optional = true }

# gRPC dependencies
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

# Feature dependencies
chrono = { version = "0.4", optional = true, features = ["serde"] }

# Validation dependencies
validator = { version = "0.19", optional = true, features = ["derive"] }
regex = { version = "1.12", optional = true }
once_cell = { version = "1.21", optional = true }

# Security dependencies
dashmap = { version = "5.5", optional = true }
uuid = { version = "1.20", optional = true, features = ["v4"] }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
secrets = { version = "1.2", optional = true }
zeroize = { version = "1.8", optional = true }
subtle = { version = "2.6", optional = true }
argon2 = { version = "0.5", optional = true, features = ["std"] }
password-hash = { version = "0.6.0-rc.11", optional = true }
rand = { version = "0.8", optional = true }

# Configuration dependencies (按特性导入)
confers = { path = "/home/dev/projects/confers", optional = true, features = ["watch"] }
toml = { version = "0.9", optional = true }
schemars = { version = "0.8", optional = true }

# Cache dependencies (按特性导入) - oxcache 自己管理 sha2/md5/bytes/http 等
oxcache = { version = "0.2", path = "/home/dev/projects/oxcache", features = ["rate-limiting", "dashmap"], optional = true }
http = { version = "1.4", optional = true }

# Serialization for SyncCache storage values
bincode = { version = "1.3", optional = true }

# Logging - inklog 完全接管（tracing 作为公共接口保留，由 inklog 内部使用）
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["json"] }
inklog = { path = "/home/dev/projects/inklog", optional = true }

# CLI dependencies (按特性导入)
clap = { version = "4.5", optional = true, features = ["derive"] }
tera = { version = "1.20", optional = true }
walkdir = { version = "2.5", optional = true }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros"] }
once_cell = "1.21"
sdforge-macros = { version = "0.1.0", path = "./macros" }
tempfile = "3.24"
serial_test = "3.0"
axum-test = "19"
reqwest = { version = "0.12", features = ["json"] }
criterion = "0.5"
trybuild = "1.0"
proptest = "1.9"

[features]
default = ["http"]

# HTTP 特性 - 启用时编译 confers、axum 等
http = [
    "confers",
    "axum",
    "tower",
    "tower-http",
    "inventory",
    "figment",
    "tokio",
    "axum-extra",
    "toml",
    "regex",
    "once_cell",
    "validator",
    "dashmap",
    "uuid",
    "futures",
    "futures-util",
]

# MCP 特性
mcp = ["mcp-sdk", "inventory", "anyhow"]

# Streaming 特性
streaming = ["http", "tokio-stream", "futures-util", "chrono"]

# Timestamp 特性
timestamp = ["chrono"]

# Logging 特性 - inklog 完全接管，tracing 作为公共接口由 inklog 内部管理
logging = ["tracing", "tracing-subscriber", "inklog"]

# Security 特性
security = [
    "http",
    "dashmap",
    "uuid",
    "hmac",
    "sha2",
    "chrono",
    "tokio",
    "secrets",
    "zeroize",
    "subtle",
    "once_cell",
    "argon2",
    "password-hash",
    "rand",
    "regex",
    "oxcache/rate-limiting",
    "bincode",
    "confers",
    "cache",
]

# Hot reload 特性
hot-reload = ["http", "confers"]

# Confers 扩展特性
validation = ["confers/validation"]
schema = ["confers/schema", "schemars"]
watch = ["confers/watch"]
audit = ["confers/audit"]

# WebSocket 特性
websocket = ["http", "streaming", "tokio-tungstenite", "axum-extra", "async-trait", "chrono"]

# gRPC 特性
grpc = ["http", "tonic", "prost"]

# Cache 特性 - oxcache 提供缓存抽象，rate-limiting 提供 TokenBucket
cache = ["dep:http", "oxcache/rate-limiting", "async-trait"]

# CLI 特性 - 日志由 inklog 管理
cli = [
    "clap",
    "anyhow",
    "tera",
    "walkdir",
    "tracing",
    "tracing-subscriber",
    "inklog",
    "confers/cli",
]

# Full 特性
full = [
    "http",
    "mcp",
    "streaming",
    "timestamp",
    "logging",
    "security",
    "hot-reload",
    "cache",
    "websocket",
    "grpc",
]

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "sdforge"
path = "src/main.rs"

[[bench]]
name = "axiom_bench"
path = "src/benches/sdforge_bench.rs"
harness = false

# Integration tests
[[test]]
name = "feature_combinations"
path = "tests/integration/feature_combinations.rs"

[[test]]
name = "grpc_tests"
path = "tests/integration/grpc_tests.rs"

[[test]]
name = "http_integration"
path = "tests/integration/http_integration.rs"

[[test]]
name = "mcp_integration"
path = "tests/integration/mcp_integration.rs"

[[test]]
name = "security_headers_tests"
path = "tests/integration/security_headers_tests.rs"

[[test]]
name = "security_middleware_tests"
path = "tests/integration/security_middleware_tests.rs"

[[test]]
name = "streaming_tests"
path = "tests/integration/streaming_tests.rs"

[[test]]
name = "uat_tests"
path = "tests/integration/uat_tests.rs"

[[test]]
name = "websocket_integration_tests"
path = "tests/integration/websocket_integration_tests.rs"

[[test]]
name = "websocket_tests"
path = "tests/integration/websocket_tests.rs"

[[test]]
name = "integration_http_mcp"
path = "tests/integration_http_mcp.rs"

# Unit tests
[[test]]
name = "config_tests"
path = "tests/unit/config_tests.rs"

[[test]]
name = "core_tests"
path = "tests/unit/core_tests.rs"

[[test]]
name = "edge_case_tests"
path = "tests/unit/edge_case_tests.rs"

[[test]]
name = "http_version_routing_tests"
path = "tests/unit/http_version_routing_tests.rs"

[[test]]
name = "mcp_tool_instance_tests"
path = "tests/unit/mcp_tool_instance_tests.rs"

[[test]]
name = "macro_tests"
path = "tests/macros/macro_tests.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"

[profile.dev]
debug = true

[profile.dev.package."*"]
opt-level = 0
