[workspace]
members = [".", "examples", "macros"]
resolver = "2"

[workspace.package]
version = "0.5.0-rc.3"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/Kirky-X/sdforge"

[workspace.dependencies]
# 核心依赖
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false }
log = { version = "0.4", default-features = false, features = ["std"] }

# 过程宏依赖
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
syn = { version = "3.0", default-features = false, features = ["full", "extra-traits", "parsing", "printing", "clone-impls", "proc-macro"] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }

# HTTP 依赖
axum = { version = "0.8", default-features = false, features = ["http1", "json", "form", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing", "ws"] }
tower = { version = "0.5", default-features = false, features = ["log", "util", "timeout", "limit", "load-shed", "retry"] }
tower-http = { version = "0.7", default-features = false, features = ["cors", "limit", "timeout", "set-header", "compression-gzip", "compression-deflate"] }
inventory = { version = "0.3", default-features = false }

# 异步依赖
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
tokio-stream = { version = "0.1", default-features = false }

# 工具依赖
uuid = { version = "1.23", default-features = false, features = ["std", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf"] }
validator = { version = "0.21", default-features = false, features = ["derive"] }
once_cell = { version = "1.21", default-features = false, features = ["std"] }

# 安全依赖
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
base64 = { version = "0.23", default-features = false, features = ["std", "alloc"] }

# 配置依赖
toml = { version = "1.1", default-features = false, features = ["parse", "display"] }

# 缓存依赖 - oxcache 0.3 用 minimal feature 提供内存后端 + 序列化 + tracing
oxcache = { version = "0.5.0-rc.4", default-features = false, features = ["minimal"] }
http = { version = "1.4", default-features = false, features = ["std"] }
bincode = { version = "2.0", default-features = false, features = ["std", "serde"] }

# WebSocket 依赖
axum-extra = { version = "0.12", default-features = false, features = ["typed-header"] }

# gRPC 依赖
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
prost = { version = "0.14", default-features = false, features = ["derive"] }
tonic-prost = { version = "0.14", default-features = false }

# 流控依赖 - limiteron 0.2.1 提供统一限流/封禁/配额/熔断
# 纯 crates.io 版本依赖（rc.2 已发布；本地跨仓联调可用 .cargo/config.toml [patch]）。
limiteron = { version = "0.3.0-rc.3", default-features = false }

# OpenAPI 依赖
utoipa = { version = "5.5", default-features = false, features = ["macros"] }

# CLI 依赖 - clap 4.6 提供命令行解析（derive feature 用于过程宏派生）
# string feature 启用 Str: From<String>，支持运行时配置程序名（MED-4）
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "string"] }

# Swagger UI 依赖 - utoipa-swagger-ui 8.0 配合 utoipa 5.5 提供交互式 API 文档
utoipa-swagger-ui = { version = "9.0", default-features = false, features = ["axum"] }

# CLI Markdown 文档依赖 - clap-markdown 0.1 从 clap::Command 生成 Markdown 命令手册
clap-markdown = { version = "0.1", default-features = false }

# 其他依赖
url = { version = "2.5", default-features = false }
simd-json = { version = "0.18", default-features = false, features = ["serde_impl"] }

# 开发依赖
tempfile = { version = "3.27", default-features = false }
serial_test = { version = "4.0", default-features = false }
axum-test = { version = "21", default-features = false, features = ["ws"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
criterion = { version = "0.8", default-features = false }
trybuild = { version = "1.0", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std", "alloc", "bit-set"] }
pretty_assertions = { version = "1.4", default-features = false, features = ["std"] }

[workspace.lints.rust]

[workspace.lints.clippy]

[package]
name = "sdforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["api", "http", "mcp", "macro", "framework"]
categories = ["web-programming", "development-tools"]
description = "Multi-protocol SDK framework with unified macro configuration"
documentation = "https://docs.rs/sdforge"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Performance verification examples — require `cache` feature for SyncCache.
# Declared with required-features so `cargo test --features http --workspace`
# does not attempt to compile them without the cache feature enabled.
[[example]]
name = "perf_regex_cache"
required-features = ["cache"]
[[example]]
name = "perf_lru_eviction"
required-features = ["cache"]
[[example]]
name = "perf_prefix_index"
required-features = ["cache"]
[[example]]
name = "perf_batch_ops"
required-features = ["cache"]

# CLI 基础示例 — 演示 #[forge(cli=true)] + CliBuilder 集成
[[example]]
name = "basic_cli"
required-features = ["cli"]

# Swagger UI 示例 — 演示 swagger_ui_router() + axum serve
[[example]]
name = "swagger_demo"
required-features = ["docs"]

[dependencies]
# Core dependencies (always required)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
sdforge-macros = { version = "0.5.0-rc.3", path = "./macros" }

# HTTP dependencies
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true, features = ["typed-header"] }

# MCP dependencies (migrated from mcp-sdk 0.0.3 to official rmcp)
# transport-io enables rmcp::transport::stdio() used by serve_stdio()
rmcp = { version = "3.2", optional = true, default-features = false, features = ["server", "transport-io"] }
anyhow = { version = "1.0", optional = true, default-features = false, features = ["std"] }

# Streaming dependencies
tokio-stream = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# gRPC dependencies
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

# OpenAPI dependencies
utoipa = { workspace = true, optional = true }

# CLI dependencies - clap 用于命令行参数解析
clap = { workspace = true, optional = true }

# Docs dependencies - Swagger UI 和 Markdown 文档生成
utoipa-swagger-ui = { workspace = true, optional = true }
clap-markdown = { workspace = true, optional = true }

# Feature dependencies
chrono = { workspace = true, optional = true }

# Validation dependencies
validator = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }

# Security dependencies
uuid = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# Configuration dependencies
toml = { workspace = true, optional = true }

# Cache dependencies - oxcache 0.3 用 memory feature 提供缓存后端
oxcache = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# Serialization for SyncCache storage values
bincode = { workspace = true, optional = true }

# SIMD-accelerated JSON (optional, requires SIMD support)
simd-json = { workspace = true, optional = true }

# Rate limiting dependencies - limiteron 0.2.1 提供统一流控
limiteron = { workspace = true, optional = true }

# trait-kit integration (optional, feature-gated via `kit`).
# trait-kit 0.3 is published to crates.io.
# Mirrors dbnexus's pattern (Phase 4 of trait-kit-async-integration).
# default-features = false (Rule 6) — only the `async` feature is pulled in.
trait-kit = { version = "0.5.0-rc.3", features = ["async"], optional = true, default-features = false }

# inklog 结构化日志集成 (optional, feature-gated by `inklog`).
# 纯 crates.io 版本依赖（rc.2 已发布）。
# default-features = false (Rule 6) — only core logging is pulled in.
inklog = { version = "0.3.0-rc.3", default-features = false, optional = true }

# ICU4X internationalization (optional, feature-gated via `i18n`).
# icu 2.2 provides locale-aware number/date/plural/collation formatting +
# Accept-Language HTTP header parsing for HTTP responses.
icu = { version = "2.3", optional = true }
writeable = { version = "0.6", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }
once_cell = { workspace = true }
sdforge-macros = { version = "0.5.0-rc.2", path = "./macros", default-features = false }
tempfile = { workspace = true }
serial_test = { workspace = true }
axum-test = { workspace = true }
reqwest = { workspace = true }
criterion = { workspace = true }
trybuild = { workspace = true }
proptest = { workspace = true }
url = { workspace = true }

[features]
default = []

# HTTP 特性 - 启用时编译 axum 等
http = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:inventory",
    "tokio",
    "dep:axum-extra",
    "dep:toml",
    "dep:regex",
    "dep:once_cell",
    "dep:validator",
    "dep:uuid",
]

# MCP 特性 (migrated to official rmcp SDK 2.1.0)
# http crate needed for MCP 2026-07-28 stateless HTTP header parsing (Mcp-Method/Mcp-Name)
mcp = ["dep:rmcp", "dep:inventory", "dep:anyhow", "dep:http"]

# Streaming 特性
# 独立于 http：核心只用 tokio + tokio-stream + futures-util + chrono
# impl IntoResponse 已有 #[cfg(feature = "http")] 门控
streaming = ["dep:tokio", "dep:tokio-stream", "dep:futures-util", "dep:chrono"]

# Timestamp 特性
timestamp = ["dep:chrono"]

# Rate limiting 特性 - 纯限流核心（不依赖 http）
# 仅包含 RateLimiter trait（check 方法）+ LimiteronAdapter + RateLimitError
# 不依赖 axum/tower，可在非 HTTP 环境（如 gRPC/CLI）中使用
ratelimit = [
    "dep:limiteron",
    "limiteron/ban-manager",
    "limiteron/quota-control",
    "limiteron/circuit-breaker",
]

# HTTP 限流中间件 - Tower middleware + check_request 方法
# 依赖 http（axum/tower）和 ratelimit（核心 trait）
# 启用后提供 RateLimitLayer/RateLimitMiddleware/HttpRequestRateLimiter
ratelimit-http = [
    "http",
    "ratelimit",
]

# Security 特性
security = [
    "http",
    "dep:uuid",
    "dep:hmac",
    "dep:sha2",
    "dep:chrono",
    "tokio",
    "dep:subtle",
    "dep:once_cell",
    "dep:rand",
    "dep:regex",
    "oxcache/minimal",
    "dep:bincode",
    "cache",
    "hex",
    "dep:base64",
    "ratelimit-http",
]

# WebSocket 特性
websocket = ["http", "streaming", "dep:axum-extra", "dep:chrono"]

# gRPC 特性
# 独立于 http：grpc 模块只用 tonic + prost + serde_json + futures-util (catch_unwind)
grpc = ["dep:tonic", "dep:prost", "dep:tonic-prost", "dep:inventory", "dep:futures-util"]

# OpenAPI 特性 - 自动生成 OpenAPI 3.1 规范
# 独立于 http：openapi 模块只用 utoipa + inventory + serde_json
openapi = ["dep:utoipa", "dep:inventory"]

# CLI 特性 - clap 集成，与 HTTP/MCP 并列的第三种服务入口
# 独立于 http：cli 模块只用 clap + inventory + crate::core::ApiError
cli = ["dep:clap", "dep:inventory"]

# Docs 特性 - 统一文档输出（Swagger UI + CLI/MCP Markdown）
# 依赖 openapi（复用 OpenAPI 生成）+ utoipa-swagger-ui + clap-markdown + cli（docs 子命令需要 CLI 框架）
docs = ["openapi", "dep:utoipa-swagger-ui", "dep:clap-markdown", "cli"]

# Cache 特性 - oxcache 0.3 用 minimal feature 提供缓存后端
# cache 模块不依赖 http（已验证 src/cache/ 无 http/axum 使用）
cache = ["oxcache/minimal"]

# Health probes 特性 (T701) - build_with_config 自动挂载 /healthz /readyz
# （bypass 认证：探针路由在安全中间件层之后注册）。kit 数据源经 `kit` 特性提供。
health = ["http", "tokio"]

# Prometheus metrics 特性 (T702) - 请求计数/延迟直方图/状态码分布自动采集，
# /metrics 端点 bypass 认证；自研轻量 Prometheus 文本渲染（无 prometheus 依赖）。
metrics = ["http", "tokio"]

# 优雅停机特性 (T704) - SIGTERM/SIGINT → 停止接新 → 排空在途（超时上限）→
# kit 三阶段关闭；serve_with_graceful_shutdown 集成入口。
graceful = ["http", "tokio", "tokio?/signal"]

# 请求上下文特性 (T705) - request_id/trace_id 生成与跨协议（HTTP/MCP/gRPC/WS）
# 注入，日志关联字段；tokio task_local 承载。
context = ["tokio"]

# 参数校验契约特性 (T707) - #[forge(validate)] + #[param(ge/le/...)] 校验规则，
# 400 带字段级错误；验证语句由宏注入 HTTP 处理闭包。
validate = ["http", "tokio"]

# 声明式分页特性 (T708) - #[forge(paginate)] 自动 page/size 查询参数与
# {items,total,next} 响应包装；处理函数返回完整 Vec<T>。
paginate = ["http", "tokio"]

# ETag 条件请求特性 (T709) - GET 响应自动强 ETag（SHA-256）+ If-None-Match → 304。
etag = ["http", "dep:sha2"]

# 生命周期钩子特性 (T711) - #[forge(on_start/on_stop)] 进程级钩子，
# 与 T704 优雅停机顺序协同（on_start 先于监听、on_stop 在排空之后）。
lifecycle = ["http", "tokio", "dep:futures-util"]

# 钩子管道特性 (T713) - 处理器前后钩子（中间件式），统一错误契约同批交付。
hooks = ["http", "tokio"]

# OTel 全栈观测特性 (T714) - OTLP/HTTP JSON 导出（MVP：本地 collector，无 TLS），
# 请求 span 中间件 + 指标快照导出；零额外依赖（自研轻量 HTTP POST）。
otel = ["http", "tokio"]

# Logging 特性
# `dep:once_cell` is required because `src/logging.rs` uses
# `once_cell::sync::OnceCell` for `GLOBAL_LOGGER`. Without this, building
# `--features logging` alone (without `http`, which also enables once_cell)
# fails with "cannot find module or crate `once_cell`".
logging = ["dep:chrono", "dep:once_cell", "tokio"]

# tokio feature (enables dep:tokio; referenced by #[cfg(feature = "tokio")] in source)
tokio = ["dep:tokio"]

# SIMD JSON 特性 - 使用 SIMD 加速的 JSON 序列化/反序列化
simd-json = ["dep:simd-json"]

# trait-kit 0.3 AsyncKit integration (SdforgeModule). Two-layer feature
# gating mirrors dbnexus's pattern (Phase 4):
#   - `limiteron-integration`: pulls in `dep:limiteron` only — enough for
#     `LimiteronForgeAdapter` (which wraps `limiteron::Governor` directly).
#   - `kit`: full integration — adds `dep:trait-kit` (with `async` feature)
#     and `limiteron/kit` (so `limiteron::integrations::kit::LimiteronModule`
#     is visible to `SdforgeModule::dependencies()` and `build()`).
# `limiteron/kit` is required because `LimiteronModule` is gated behind
# limiteron's `kit` feature (Phase 3). default-features = false (Rule 6).
limiteron-integration = ["dep:limiteron"]
# `trait-kit/health` (T701): AsyncKit::health_report() powers the /readyz
# kit data source (health::kit_source::KitHealthSource).
# `trait-kit/lifecycle` (T704): AsyncKit::shutdown_async() phased teardown
# runs as phase 3 of serve_with_graceful_shutdown.
# `oxcache/kit` (T704 alignment): limiteron T617 makes LimiteronModule depend
# on oxcache's OxcacheModule — activate it so the kit graph resolves.
kit = ["dep:trait-kit", "trait-kit/health", "trait-kit/lifecycle", "limiteron-integration", "limiteron/kit", "oxcache/kit"]

# inklog 结构化日志集成 — 将裸 log 输出桥接到 inklog LoggerManager。
# 启用后通过 init_inklog_logger() 安装 inklog 为全局 log 后端，
# 现有 log::error!/log::warn! 等调用自动路由到 inklog 管道。
inklog = ["dep:inklog"]

# ICU4X-backed internationalization: locale-aware HTTP error messages,
# number/timestamp formatting, plural rules, header collation, and
# Accept-Language header parsing via the `icu` crate (ICU4X 2.x).
i18n = ["dep:icu", "dep:writeable"]

# Full 特性
full = [
    "http",
    "mcp",
    "streaming",
    "timestamp",
    "security",
    "cache",
    "health",
    "metrics",
    "graceful",
    "context",
    "websocket",
    "grpc",
    "logging",
    "openapi",
    "cli",
    "docs",
    "inklog",
    "i18n",
]
hex = ["dep:hex"]

[build-dependencies]
tonic-build = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14", default-features = false }

