name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 版本更新和预检
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check for changes since last tag
        id: changes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline | head -20)
          else
            CHANGES=$(git log $PREV_TAG..HEAD --oneline)
          fi
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display release info
        run: |
          echo "Releasing version: ${{ steps.version.outputs.version }}"
          echo ""
          echo "Changes since last release:"
          echo "${{ steps.changes.outputs.changes }}"

  # 生成源码包
  source-package:
    name: Create Source Package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create source archive
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          
          # 创建源码包
          git archive --format=tar.gz --prefix="sdforge-${VERSION}/" -o "sdforge-${VERSION}-crate.tar.gz" HEAD
          
          # 生成 SHA256 校验和
          sha256sum "sdforge-${VERSION}-crate.tar.gz" | awk '{print $1}' > "sdforge-${VERSION}-crate.tar.gz.sha256"
          
          # 创建校验和文件
          echo "$VERSION" > VERSION
          
          ls -la

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: "sdforge-*.tar.gz*"
          retention-days: 5

  # 生成变更日志
  changelog:
    name: Generate Changelog
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          # 解析 conventional commits
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"%s" 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"%s" | head -50 2>/dev/null || echo "")
          fi
          
          # 分类提交
          FEATURES=""
          FIXES=""
          CHORES=""
          DOCS=""
          OTHER=""
          
          while IFS= read -r line; do
            case "$line" in
              feat*|feature*) FEATURES="${FEATURES}- ${line}\n" ;;
              fix*) FIXES="${FIXES}- ${line}\n" ;;
              docs*) DOCS="${DOCS}- ${line}\n" ;;
              chore*|refactor*|perf*|test*|build*|ci*) CHORES="${CHORES}- ${line}\n" ;;
              *) OTHER="${OTHER}- ${line}\n" ;;
            esac
          done <<< "$COMMITS"
          
          BODY="## What's Changed\n\n"
          
          [ -n "$FEATURES" ] && BODY="${BODY}### Features\n$(printf "$FEATURES")\n"
          [ -n "$FIXES" ] && BODY="${BODY}### Bug Fixes\n$(printf "$FIXES")\n"
          [ -n "$DOCS" ] && BODY="${BODY}### Documentation\n$(printf "$DOCS")\n"
          [ -n "$CHORES" ] && BODY="${BODY}### Other Changes\n$(printf "$CHORES")\n"
          [ -n "$OTHER" ] && BODY="${BODY}### Miscellaneous\n$(printf "$OTHER")\n"
          
          BODY="${BODY}\n---\n*Previous releases: [GitHub Releases](https://github.com/${{ github.repository }}/releases)*"
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # 发布到 GitHub
  github-release:
    name: Create GitHub Release
    needs: [prepare, source-package, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download source package
        uses: actions/download-artifact@v4
        with:
          name: source-package
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release v${{ needs.prepare.outputs.version }}
          body: ${{ needs.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布到 crates.io
  crates-io:
    name: Publish to crates.io
    needs: [prepare]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Set up Cargo config for Trusted Publishing
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [registries.crates-io]
          protocol = "sparse"
          EOF

      - name: Publish to crates.io
        run: |
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # 清理失败通知
  cleanup:
    name: Cleanup on Failure
    needs: [prepare, source-package, changelog, github-release, crates-io]
    runs-on: ubuntu-latest
    if: failure()
    timeout-minutes: 5
    steps:
      - name: Display failure info
        run: |
          echo "Release workflow failed."
          echo "Please check the logs and manually clean up if needed."
          echo "Artifacts may still be available in the Actions run for manual download."
