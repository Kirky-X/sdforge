name: Code Review

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          echo "files=$(git diff --name-only HEAD~1 | head -50)" >> $GITHUB_OUTPUT

      - name: Run Claude Code Review
        uses: anthropics/claude-code-review-action@v1
        if: steps.changed-files.outputs.files != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          max_comments: 20
          review_type: pr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  check-labels:
    name: Check Labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for required labels
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: "needs-review"
        continue-on-error: true

      - name: Add review required label
        if: always()
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: "reviewed"
        continue-on-error: true

  size-check:
    name: Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get PR size
        run: |
          echo "Checking PR size..."

      - name: Comment on large PRs
        if: github.event.pull_request.additions > 500 || github.event.pull_request.deletions > 500
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ This PR is quite large. Consider splitting it into smaller PRs for easier review.'
            })
