# Axiom 完整配置文件

[server]
host = "0.0.0.0"
port = 8080

[server.cors]
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "PUT", "DELETE"]
allowed_headers = ["Content-Type", "Authorization"]
allow_credentials = false
max_age = 3600

[api]
name = "axiom-full-example"
version = "0.1.0"
description = "Axiom framework full feature example"

[rate_limit]
max_requests = 100
window_seconds = 60

[rate_limit.endpoints]
"/api/v1/tasks" = { max_requests = 200, window_seconds = 60 }

[logging]
level = "info"
format = "json"

[tracing]
level = "info"
targets = ["axiom", "axiom_validation"]