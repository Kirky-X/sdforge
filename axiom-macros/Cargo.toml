[package]
name = "axiom-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for Axiom framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiom-rs/axiom"
documentation = "https://docs.rs/axiom-macros"

[dependencies]
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
darling = "0.20"
proc-macro-error = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
prettyplease = { version = "0.2", optional = true }
axum = { version = "0.8.8", optional = true }
tokio = { version = "1.41", optional = true, features = ["sync"] }

[features]
default = ["http"]
http = ["dep:axum", "dep:tokio"]
debug = ["dep:prettyplease"]

[lib]
proc-macro = true

[dev-dependencies]
trybuild = "1.0"
pretty_assertions = "1.4"
