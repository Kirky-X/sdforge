syntax = "proto3";

package axiom.v1;

// Axiom gRPC service definition
service AxiomService {
  // Call an API method
  rpc Call (CallRequest) returns (CallResponse);
  
  // Get service information
  rpc GetInfo (InfoRequest) returns (InfoResponse);
}

// Request message for calling an API
message CallRequest {
  // The API method name to call
  string method = 1;
  // Method parameters as key-value pairs
  map<string, string> params = 2;
  // Additional metadata for the request
  map<string, string> metadata = 3;
}

// Response message for API call result
message CallResponse {
  // Whether the call was successful
  bool success = 1;
  // JSON encoded response data
  string data = 2;
  // Error message if failed
  string error = 3;
  // HTTP status code
  int32 status_code = 4;
}

// Request message for getting service info
message InfoRequest {
  // Empty request
}

// Response message with service information
message InfoResponse {
  // Service name
  string name = 1;
  // Service version
  string version = 2;
  // List of available methods
  repeated string methods = 3;
  // Service description
  string description = 4;
}