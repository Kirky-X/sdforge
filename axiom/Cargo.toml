[package]
name = "axiom"
version = "0.1.0"
edition = "2021"
description = "Multi-protocol SDK framework with unified macro configuration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiom-rs/axiom"
keywords = ["api", "http", "mcp", "macro", "framework"]
categories = ["web-programming", "development-tools"]
authors = ["Axiom Team"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
inventory = { version = "0.3", optional = true }
axiom-macros = { path = "../axiom-macros" }
async-trait = { version = "0.1", optional = true }

# HTTP dependencies (optional)
axum = { version = "0.8.8", optional = true, features = ["ws"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6.2", features = ["cors"], optional = true }

# MCP dependencies (optional)
mcp-sdk = { version = "0.0.3", optional = true }
anyhow = { version = "1.0", optional = true }

# Streaming dependencies (optional)
tokio-stream = { version = "0.1", optional = true }
tokio = { version = "1.41", optional = true, features = ["sync"] }
futures-util = { version = "0.3", optional = true }

# WebSocket dependencies (optional)
tokio-tungstenite = { version = "0.23", optional = true }
axum-extra = { version = "0.9", features = ["typed-header"], optional = true }

# gRPC dependencies (optional)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

# Feature dependencies (optional)
chrono = { version = "0.4", optional = true, features = ["serde"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-appender = { version = "0.2", optional = true }

# Validation dependencies (optional)
validator = { version = "0.18", features = ["derive"], optional = true }
regex = { version = "1.5", optional = true }
once_cell = { version = "1.20", optional = true }

# Security dependencies (optional)
dashmap = { version = "5.5", optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }

# Configuration dependencies (optional)
toml = { version = "0.8", optional = true }
notify = { version = "6.0", optional = true }

# Cache dependencies (optional)
cached = { version = "0.49", optional = true }
cached_proc_macro = { version = "0.23", optional = true }
redis = { version = "0.25", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "macros"] }
once_cell = "1.20"
axiom-macros = { path = "../axiom-macros" }
http = "1.0"
tempfile = "3.10"

# UAT 测试依赖
axum-test = "16.0"
reqwest = { version = "0.12", features = ["json"] }
criterion = "0.5"
trybuild = "1.0"
proptest = "1.4"

[features]
default = ["http"]
http = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:inventory",
    "dep:chrono",
    "dep:validator",
    "dep:regex",
    "dep:dashmap",
    "dep:uuid",
    "dep:toml",
    "dep:once_cell",
    "dep:notify",
    "dep:tokio",
]
mcp = ["dep:mcp-sdk", "dep:inventory", "dep:anyhow"]
streaming = ["http", "dep:tokio-stream", "dep:tokio", "dep:futures-util"]
timestamp = ["dep:chrono"]
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender", "tracing-subscriber/env-filter"]
security = ["http", "dep:dashmap", "dep:uuid"]
hot-reload = ["http", "dep:notify"]
websocket = ["http", "streaming", "dep:tokio-tungstenite", "dep:axum-extra", "dep:async-trait"]
grpc = ["http", "dep:tonic", "dep:prost"]
cache = ["http", "dep:cached", "dep:sha2", "dep:futures-util", "dep:cached_proc_macro"]
cache-redis = ["cache", "dep:redis"]
full = ["http", "mcp", "streaming", "timestamp", "logging", "security", "hot-reload", "cache", "websocket", "grpc"]

[build-dependencies]
tonic-build = { version = "0.12" }

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "axiom_bench"
harness = false
