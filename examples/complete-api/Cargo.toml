[package]
name = "sdforge-complete-api-example"
version = "0.2.0"
edition = "2021"

[dependencies]
sdforge = { path = "../../src", features = ["full"] }
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[[bin]]
name = "complete-api"
path = "src/main.rs"
