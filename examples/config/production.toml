# SDForge Configuration - Production Example
#
# SdForgeConfig recognizes only [server] / [authentication] / [timeout] /
# [security] / [cache] sections (unknown keys are silently ignored).

# Server Configuration
[server]
host = "0.0.0.0"
port = 443
request_timeout_secs = 60

# CORS Configuration
[server.cors]
allowed_origins = ["https://yourdomain.com"]
allowed_methods = ["GET", "POST", "PUT", "DELETE"]
allowed_headers = ["Content-Type", "Authorization"]

# TLS Configuration (serve-tls feature; consumed by http::tls)
[server.tls]
cert_path = "/etc/sdforge/tls/cert.pem"
key_path = "/etc/sdforge/tls/key.pem"
# ALPN offered to clients; defaults to ["h2", "http/1.1"]
# alpn_protocols = ["h2", "http/1.1"]

# Authentication Configuration
[authentication]
type = "jwt"
secret = "CHANGE_THIS_TO_A_STRONG_RANDOM_SECRET"

# Rate Limiting Configuration (`security` feature; the limiteron
# FlowControlConfig value is assembled by build_with_config_ext_rate_limited)
[security.rate_limit]
version = "1.0"

[security.rate_limit.global]
storage = "memory"
cache = "memory"
metrics = "prometheus"

[[security.rate_limit.rules]]
id = "http_default"
name = "HTTP default rate limit"
priority = 100

[[security.rate_limit.rules.matchers]]
type = "User"
user_ids = ["*"]

[[security.rate_limit.rules.limiters]]
type = "TokenBucket"
capacity = 1000   # burst capacity
refill_rate = 17  # tokens refilled per second (~1000 requests/min steady state)

[security.rate_limit.rules.action]
on_exceed = "reject"
