# SDForge Configuration - Production Example

# Server Configuration
[server]
host = "0.0.0.0"
port = 443
request_timeout_secs = 60

# CORS Configuration
[server.cors]
allowed_origins = ["https://yourdomain.com"]
allowed_methods = ["GET", "POST", "PUT", "DELETE"]
allowed_headers = ["Content-Type", "Authorization"]

# TLS Configuration (serve-tls feature; consumed by http::tls)
[server.tls]
cert_path = "/etc/sdforge/tls/cert.pem"
key_path = "/etc/sdforge/tls/key.pem"
# ALPN offered to clients; defaults to ["h2", "http/1.1"]
# alpn_protocols = ["h2", "http/1.1"]

# Authentication Configuration
[authentication]
type = "jwt"
secret = "CHANGE_THIS_TO_A_STRONG_RANDOM_SECRET"

# Rate Limiting Configuration
[rate_limit]
requests = 1000
window_seconds = 60

# Logging Configuration
[logging]
level = "warn"
format = "json"
