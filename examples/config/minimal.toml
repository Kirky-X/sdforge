# SDForge Configuration - Minimal Example
#
# SdForgeConfig recognizes only [server] / [authentication] / [timeout] /
# [security] / [cache] sections (unknown keys are silently ignored).

# Server Configuration
[server]
host = "0.0.0.0"
port = 3000
request_timeout_secs = 30

# Authentication Configuration - JWT
[authentication]
type = "jwt"
secret = "change-this-secret-in-production"
