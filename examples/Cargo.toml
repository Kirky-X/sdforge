[package]
name = "sdforge-examples"
version = "0.2.0"
edition = "2021"
description = "Examples demonstrating SDForge framework functionality"
license = "MIT"
repository = "https://github.com/Kirky-X/sdforge"
keywords = ["examples", "sdforge", "http", "mcp"]
categories = ["web-programming", "development-tools"]

[workspace]

[dependencies]
sdforge = { path = "..", default-features = false }
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

[features]
default = ["http"]
http = ["sdforge/http"]
mcp = ["sdforge/mcp"]
streaming = ["sdforge/streaming"]
security = ["sdforge/security"]
cache = ["sdforge/cache"]
websocket = ["sdforge/websocket"]
grpc = ["sdforge/grpc"]
logging = ["sdforge/logging"]
full = ["http", "mcp", "streaming", "security", "cache", "websocket", "grpc", "logging"]
