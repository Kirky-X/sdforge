[package]
name = "sdforge-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Examples demonstrating SDForge framework functionality"
license.workspace = true
repository = "https://github.com/Kirky-X/sdforge"
keywords = ["examples", "sdforge", "http", "mcp"]
categories = ["web-programming", "development-tools"]
publish = false

# `#[forge]` 发射的 cfg 引用 sdforge 的 feature 名，而非本 crate 的 *_examples
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("http", "mcp", "grpc", "cli", "websocket", "openapi", "security", "lifecycle", "docgen"))'] }

[dependencies]
sdforge = { version = "0.5.0-rc.9", path = "..", default-features = false }
tokio = { workspace = true, features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# log facade：logging 示例演示 `log::info!` 等调用经 inklog 桥零改动路由
log = { workspace = true }
# inventory/axum/clap/rmcp/tonic/prost 均由 sdforge re-export
utoipa = { workspace = true }
oxcache = { workspace = true, optional = true }
# 经 workspace 继承（同 oxcache）：自研依赖定值只需改根清单一处，
# 避免成员内联版本号漏改而漂移
dbnexus = { workspace = true, optional = true }

[features]
default = ["http_examples", "mcp_examples", "websocket_examples", "streaming_examples", "security_examples", "idempotency_examples", "cache_examples", "grpc_examples", "logging_examples", "openapi_examples", "cli_examples", "docs_examples", "combined_examples"]
# `*_examples` features are the user-facing toggle (kept for backward compatibility).
http_examples = ["http"]
mcp_examples = ["mcp"]
websocket_examples = ["websocket"]
streaming_examples = ["streaming"]
security_examples = ["security"]
idempotency_examples = ["idempotency", "http", "cache"]
cache_examples = ["cache", "http_examples"]
grpc_examples = ["grpc"]
logging_examples = ["logging"]
openapi_examples = ["openapi", "http_examples"]
cli_examples = ["cli"]
docs_examples = ["docgen"]
combined_examples = ["http_examples", "mcp_examples", "websocket_examples",
                     "streaming_examples", "security_examples", "cache_examples",
                     "grpc_examples", "logging_examples", "openapi_examples",
                     "cli_examples", "docs_examples"]
# Ecosystem examples
oxcache_admin_example = ["http_examples", "cache_examples", "dep:oxcache"]
dbnexus_gateway_example = ["http_examples", "dep:dbnexus"]

# sdforge 特性别名：转发到对应 sdforge feature，供示例 cfg 对齐
http = ["sdforge/http"]
mcp = ["sdforge/mcp"]
websocket = ["sdforge/websocket"]
streaming = ["sdforge/streaming"]
# security 本地同时启用 ratelimit，对齐 sdforge 的 security → ratelimit 链
security = ["sdforge/security", "ratelimit"]
cache = ["sdforge/cache"]
idempotency = ["sdforge/idempotency"]
grpc = ["sdforge/grpc"]
# grpc_tls：与 sdforge grpc-tls 同门控，保证任意组合下字段存在性一致
grpc_tls = ["sdforge/grpc-tls"]
# logging（自研结构化日志栈）已在 0.5.0-rc 期删除；structured 示例
# 迁移到 inklog LoggerManager，本别名层 feature 转指 sdforge/inklog
logging = ["sdforge/inklog"]
openapi = ["sdforge/openapi"]
cli = ["sdforge/cli"]
docgen = ["sdforge/docgen"]
# 兼容别名：旧 feature 名 docs 转发到 docgen（随主仓正名迁移）
docs = ["docgen"]
# ratelimit 别名：启用 sdforge 纯限流核心（无 http），对齐字段门控
ratelimit = ["sdforge/ratelimit"]

[[example]]
name = "swagger_demo"
path = "swagger_demo.rs"
required-features = ["docgen", "http"]

# oxcache 管理端点示例（经 BackendRegistry）。
[[example]]
name = "oxcache_admin"
path = "oxcache_admin.rs"
required-features = ["oxcache_admin_example"]

# dbnexus 数据 API 网关对接示例。
[[example]]
name = "dbnexus_gateway"
path = "dbnexus_gateway.rs"
required-features = ["dbnexus_gateway_example"]

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
