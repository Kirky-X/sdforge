# Pre-commit Configuration for Axiom
# Multi-protocol Declarative SDK Framework

# See https://pre-commit.com for more information

repos:
  # =============================================================================
  # System checks (no external dependencies)
  # =============================================================================
  
  - repo: local
    hooks:
      # -----------------------------------------------------------------------------
      # Detect merge conflict markers
      # -----------------------------------------------------------------------------
      - id: detect-merge-conflicts
        name: Detect Merge Conflicts
        entry: scripts/pre-commit-check.sh --check-conflicts
        language: system
        stages: [pre-commit]
        pass_filenames: false
        
      # -----------------------------------------------------------------------------
      # Detect large files
      # -----------------------------------------------------------------------------
      - id: detect-large-files
        name: Detect Large Files (>1MB)
        entry: scripts/pre-commit-check.sh --check-large-files
        language: system
        stages: [pre-commit]
        pass_filenames: false
        
      # -----------------------------------------------------------------------------
      # Remove trailing whitespace
      # -----------------------------------------------------------------------------
      - id: remove-trailing-whitespace
        name: Remove Trailing Whitespace
        entry: scripts/pre-commit-check.sh --fix-whitespace
        language: system
        stages: [pre-commit]
        pass_filenames: false

  # =============================================================================
  # YAML Syntax Check
  # =============================================================================
  
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: Check YAML Syntax
        args:
          - --unsafe
        exclude: ^\.github/workflows/cargo-deny\.yml$

  # =============================================================================
  # TOML Format Check
  # =============================================================================
  
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-toml
        name: Check TOML Format

  # =============================================================================
  # Rust Formatting (rustfmt)
  # =============================================================================
  
  - repo: https://github.com/densebair/rustfmt-pre-commit
    rev: v1.1.1
    hooks:
      - id: rustfmt
        name: Rust Formatting (rustfmt)
        args:
          - --edition=2021
          - --check
        types: [rust]
        require_serial: true

  # =============================================================================
  # Rust Linting (clippy)
  # =============================================================================
  
  - repo: https://github.com/densebair/rust-clippy-pre-commit
    rev: v0.0.266
    hooks:
      - id: clippy
        name: Rust Linting (clippy)
        args:
          - --all-features
          - --all-targets
          - --workspace
          - -- -D warnings
        types: [rust]
        require_serial: true
        stages: [pre-commit]

  # =============================================================================
  # Rust Compilation Check
  # =============================================================================
  
  - repo: local
    hooks:
      - id: cargo-check
        name: Rust Compilation Check
        entry: scripts/pre-commit-check.sh --check-compile
        language: system
        stages: [pre-commit]
        pass_filenames: false
        require_serial: true

  # =============================================================================
  # Rust Full Build Check
  # =============================================================================
  
  - repo: local
    hooks:
      - id: cargo-build
        name: Rust Build Check
        entry: scripts/pre-commit-check.sh --check-build
        language: system
        stages: [pre-commit]
        pass_filenames: false
        require_serial: true

# =============================================================================
# Exclude patterns
# =============================================================================
exclude: |
  (?x)^(
    target/|
    \.git/|
    \.cargo/|
    \.claude/|
    \.github/workflows/cargo-deny\.yml|
    docs/|
    \.iflow/|
    temp/|
    \.gitignore|
    \.env\.example|
    \.cargo/config\.toml|
    tarpaulin-report\.html|
    requirements\.db
  )

# =============================================================================
# Default settings
# =============================================================================
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
verbose: true
fail_fast: false
