# typos 白名单 —— 仅登记「确为真词 / 真实标识符 / 刻意测试数据」的命中，
# 不放宽任何门禁：真正的拼写错误仍会由 typos 报告并阻断提交。
# 新增条目务必写明依据，禁止整目录/整文件排除。

[default]

# extend-words: 单词级白名单(值等于键 = 该词永远合法)
[default.extend-words]
# macros/src/lib.rs: role_lits = role literals 的惯用缩写
lits = "lits"
# macros/tests/trybuild/fail/unknown_attribute_precise_span.{rs,stderr}:
# 故意拼错的属性名(nmae2)，用于验证宏的 unknown attribute 诊断与 span 精度，
# 与 .stderr 期望输出必须逐字一致，不可"修正"
nmae = "nmae"
# src/error/i18n.rs 文档示例中的法语译文，属真实外文内容
Ressource = "Ressource"
invalide = "invalide"
# writeable —— ICU4X 组件 crate 的真实名字（无 r）。src/i18n/i18n_impl.rs 的
# `use writeable::Writeable;` 与 docs/CHANGELOG.md 的特性裁剪记录均为真实标识符，
# 不是 `writable` 的拼写错误。
writeable = "writeable"
