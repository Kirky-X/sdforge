[package]
authors = ["Kirky-X <Kirky-X@outlook.com>"]
name = "sdforge-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for SDForge framework"
license = "MIT"
repository.workspace = true
documentation = "https://docs.rs/sdforge-macros"

[lints]
workspace = true

[dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
proc-macro = true

[dev-dependencies]
trybuild = { workspace = true }
pretty_assertions = { workspace = true }
# `log_missing_inklog_feature` compile_fail 用例需 sdforge 运行时（无默认
# feature，即无 inklog）锁定"feature 关闭显性报错"契约。dev 依赖允许成环。
sdforge = { path = "..", default-features = false }
