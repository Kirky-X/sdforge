# cargo-deny 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# `cargo deny check` 校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/
# 仓库特有豁免写在 [advisories].ignore 与 [[licenses.exceptions]],须附原因注释。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# 按仓库填:传递依赖 RUSTSEC 豁免(每项须注释原因)
# RUSTSEC-2025-0141 — bincode 直接依赖,upstream 未认领,见 CHANGELOG
ignore = [
    # bincode unmaintained (RUSTSEC-2025-0141) — 直接依赖(bincode 2.0.1 → sdforge)
    # 团队永久停维,advisory 明确 "No safe upgrade available";短期保留(功能稳定+监控公告),中期评估迁移 postcard
    { id = "RUSTSEC-2025-0141", reason = "直接依赖 bincode 2.0.1,upstream 未认领,见 CHANGELOG" },
]

[licenses]
# 允许的宽松许可证;新增非宽松许可证需在此放行
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8
unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
name = "serde_yaml" # deprecated, use serde_yaml_ng
wrappers = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
