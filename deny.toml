# cargo-deny 配置 — `cargo deny check` 按此校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
ignore = [
    # bincode unmaintained (RUSTSEC-2025-0141) — 直接依赖（bincode v2.0.1 → sdforge）
    # 团队因 doxxing/harassment 事件永久停维，advisory 明确 "No safe upgrade available"
    # 替代方案：postcard / bitcode / rkyv；短期保留（功能稳定+监控公告），中期评估迁移
    { id = "RUSTSEC-2025-0141", reason = "直接依赖bincode2.0.1，团队永久停维无安全升级，评估迁移postcard" },
]

[licenses]
# 允许的宽松许可证；新增非宽松许可证需在此放行
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", "BSD-2-Clause", "ISC",
    "Unicode-3.0", "Unicode-DFS-2016",
    "Zlib", "CC0-1.0", "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
